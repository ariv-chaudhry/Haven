[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haven"
version = "0.1.0"
description = "Haven — Alexa+ household planning agent"
requires-python = ">=3.11"
authors = [
    { name = "Haven Team" }
]
dependencies = [
    "pydantic>=2.7",
    "boto3[crt]",
    "strands-agents",
    "mcp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# Two importable top-level packages:
#   haven  (src/haven)  - application code
#   aws    (aws/)       - AWS infrastructure: Bedrock config/client
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["haven*", "aws*"]

[tool.setuptools.package-data]
haven = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# "." makes the root-level `aws` package first-party for import sorting.
src = ["src", "."]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]
